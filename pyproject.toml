[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iris-memory-core"
version = "0.12.0"
description = "Host-independent cognitive memory service"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Iris Memory Core contributors" }]
# Phase 7 (ADR-0015): the FAISS adapter and its numpy bridge are runtime
# dependencies; the imports stay lazy so a runtime without them degrades the
# Vector capability instead of failing startup.
dependencies = [
  "faiss-cpu>=1.15,<2",
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
console = ["cryptography>=46,<52"]

[project.scripts]
iris-memory-core = "iris_memory_core.cli:main"

[dependency-groups]
dev = [
  "cryptography>=46,<52",
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<0.15",
  "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iris_memory_core"]

[tool.uv]
required-version = ">=0.11.29,<0.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".venv", "node_modules", "sdk/typescript/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
explicit_package_bases = true
mypy_path = ["src", "sdk/python/src"]
files = ["src", "sdk/python/src", "tools", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=iris_memory_core",
  "--cov=iris_memory_sdk",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
pythonpath = [".", "src", "sdk/python/src"]
testpaths = ["tests", "sdk/python/tests"]

[tool.coverage.run]
branch = true
source = ["src/iris_memory_core", "sdk/python/src/iris_memory_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
