[project]
name = "iris-memory-core"
version = "0.1.0"
description = "Configuration parameter definitions and an immutable registry."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow==12.3.0",
]

[tool.uv]
package = false

[tool.pyright]
include = ["companion_memory", "tests", "deployment"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright==1.1.413",
]
