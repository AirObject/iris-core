[project]
name = "iris-memory-core"
version = "0.1.0"
description = "Configuration parameter definitions and an immutable registry."
requires-python = ">=3.12,<3.13"
dependencies = [
    "h11==0.16.0",
    "wsproto==1.3.2",
    "pillow==12.3.0",
]

[tool.uv]
package = false

[tool.pyright]
include = ["companion_memory", "tests", "deployment", "clients", "protocol"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright==1.1.413",
    "jsonschema==4.25.1",
]
