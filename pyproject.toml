[project]
name = "iris-core"
version = "0.1.0"
description = "Iris learning core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jieba>=0.42,<1",
  "numpy>=2,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
iris = "iris.cli:main"

[dependency-groups]
dev = [
    "psutil>=6,<8",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
