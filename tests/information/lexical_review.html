<!doctype html>
<!-- Offline relevance annotation: actual observations, separate author suggestions, no metric computation or network. -->
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地检索 · 人工审阅</title>
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden;margin:0;font:15px/1.6 system-ui,sans-serif;color:#20312d;background:#f3f5f2}header{flex-shrink:0;padding:18px 28px;background:#143d34;color:white}h1{font-size:24px;margin:0}button,input,textarea,select{font:inherit}button{padding:7px 12px;border:1px solid #899c93;border-radius:6px;cursor:pointer;background:white;color:#173e35}button:disabled{opacity:.5;cursor:default}main{display:grid;grid-template-columns:270px 1fr;flex:1;min-height:0}nav{overflow:auto;padding:16px;border-right:1px solid #ccd6cc}nav button{display:block;width:100%;text-align:left;margin-bottom:6px}nav .selected{background:#d3e6dd;border-color:#245b47}article{overflow:auto;padding:22px;max-width:1250px}h2{margin-top:0}section{background:white;padding:18px;border:1px solid #d7ddd6;border-radius:8px;margin-bottom:16px}.muted{color:#617268;font-size:13px}.notice{flex-shrink:0;background:#fff0c9;color:#6c501a;padding:10px 16px}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #e1e6df;vertical-align:top;overflow-wrap:anywhere}td.body{min-width:190px}code{font-size:12px;overflow-wrap:anywhere}.excluded{opacity:.55}textarea{width:95%;height:55px}footer{flex-shrink:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 28px;background:white;border-top:1px solid #ccd6cc}label{margin-right:12px}details{margin:10px 0}summary{cursor:pointer}#progress{margin-left:14px}@media(max-width:800px){main{grid-template-columns:160px 1fr}article{padding:8px}td,th{padding:4px}}
</style>
<header><h1>本地检索 · 人工相关性审阅</h1><div>73组查询 · 68个实际正式对象 · 作者建议尚未人工确认</div></header>
<div class="notice">本页不联网、不自动提交、不计算正式质量指标。所有人工标签初始为空；请导出JSON后手动交回。</div>
<main><nav id="cases"></nav><article id="review"></article></main>
<footer><label>审核人 <input id="reviewer" placeholder="请填写署名"></label><button id="export">导出当前标注JSON</button><span id="progress"></span><input id="import" type="file" accept="application/json"><span class="muted">可导入同材料的草稿继续</span></footer>
<script id="data" type="application/json">REVIEW_PACKET_DATA</script>
<script>
'use strict';
const packet=JSON.parse(document.getElementById('data').textContent);
const labels=Object.fromEntries(packet.cases.map(c=>[c.case_id,{case_id:c.case_id,labels:{},reviewed:false,notes:''}]));
let selected=0;
function node(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n;}
function invalidate(state){state.reviewed=false;const button=document.getElementById('confirm-case');if(button)button.textContent='确认本组人工标注';navigation();}
function progress(){document.getElementById('progress').textContent=Object.values(labels).filter(x=>x.reviewed).length+' / '+packet.cases.length+' 组已确认';}
function navigation(){const nav=document.getElementById('cases');nav.replaceChildren();packet.cases.forEach((c,i)=>{const b=node('button',(labels[c.case_id].reviewed?'✓ ':'○ ')+c.query_text,nav);b.title=c.case_id;if(!c.case_id.startsWith('literal-'))node('div',c.purpose,b).className='muted';b.className=i===selected?'selected':'';b.onclick=()=>{selected=i;render();};});progress();}
function render(){navigation();const c=packet.cases[selected], state=labels[c.case_id], root=document.getElementById('review');root.replaceChildren();
 const heading=node('section',undefined,root);node('h2',c.query_text,heading);node('div',c.case_id+' · '+c.purpose,heading);node('p','主体筛选：'+(c.subject||'未指定（不推断主体）')+'；世界筛选：'+(c.world||'未指定'),heading);
 const results=node('section',undefined,root);node('h3','真实公开返回（顺序即排名）',results);
 c.observations.forEach(o=>{node('strong',o.phase+' · '+o.response.availability,results);node('p',o.returned_documents.map((d,i)=>(i+1)+'. '+d).join('　')||'空结果',results);node('div','候选数 '+o.response.coverage.candidate_count+'；posting访问 '+o.response.coverage.posting_visits+'；原因 '+JSON.stringify(o.response.truncation.reasons),results).className='muted';
  if(c.include_goals){const d=node('details',undefined,results);node('summary','独立当前目标区（不计入记忆相关集）',d);node('pre',JSON.stringify(o.response.sections.goals,null,2),d);}});
 const scope=node('section',undefined,root);node('h3','完整语料与人工标签',scope);node('p','作者只建议相关／不相关集合；请检查遗漏、同义及否定。OUT仅表示被实际结构条件排除，不是语义不相关。',scope);
 const apply=node('button','采用本组作者建议，再人工核对',scope);apply.onclick=()=>{for(const id of c.eligible_documents)state.labels[id]=c.author_suggested_relevant.includes(id)?'R':'N';state.reviewed=false;render();};
 const table=node('table',undefined,scope);const head=node('tr',undefined,node('thead',undefined,table));['对象 / 当前排名','正式正文','人物 / 世界','作者建议','人工标签'].forEach(x=>node('th',x,head));const tbody=node('tbody',undefined,table);
 const active=c.observations.find(o=>o.phase==='active');const order=[...packet.documents].sort((a,b)=>{const ar=active.returned_documents.indexOf(a.document_id),br=active.returned_documents.indexOf(b.document_id);return (ar<0?1000:ar)-(br<0?1000:br)||a.document_id.localeCompare(b.document_id);});
 order.forEach(d=>{const eligible=c.eligible_documents.includes(d.document_id),tr=node('tr',undefined,tbody);if(!eligible)tr.className='excluded';const td=node('td',d.document_id,tr);const rank=active.returned_documents.indexOf(d.document_id);if(rank>=0)node('div','返回第 '+(rank+1)+' 名',td);const more=node('details',undefined,td);node('summary','实际ID / revision',more);node('code',d.object_id+' / '+d.revision+(d.world_context?' / world_context='+d.world_context:''),more);node('td',d.body,tr).className='body';
 const identity=node('td',({REAL:'现实',FICTIONAL:'虚构',ROLEPLAY:'角色扮演'})[d.world_kind]+(d.world_context?' / 上下文标签 REAL':''),tr);node('div',d.subject_ids.map(id=>id===packet.identities.first?'同名人物：sample_platform/first':id===packet.identities.second?'同名人物：other_platform/second':id).join(', ')||'无主体声明',identity);
 node('td',!eligible?'结构排除':c.author_suggested_relevant.includes(d.document_id)?'建议相关（待审）':'建议不相关（待审）',tr);
 const cell=node('td',undefined,tr);if(!eligible){node('span','OUT',cell);return;}const select=node('select',undefined,cell);select.setAttribute('aria-label',d.document_id+' 人工相关性');[['','未标注'],['R','相关'],['N','不相关']].forEach(([v,t])=>{const option=node('option',t,select);option.value=v;});select.value=state.labels[d.document_id]||'';select.onchange=()=>{state.labels[d.document_id]=select.value;invalidate(state);};});
 const notes=node('section',undefined,root);node('h3','确认本组判断',notes);const area=node('textarea',undefined,notes);area.placeholder='可记录歧义、界限或材料问题';area.value=state.notes;area.oninput=()=>{state.notes=area.value;invalidate(state);};
 const confirm=node('button',state.reviewed?'本组已确认':'确认本组人工标注',notes);confirm.id='confirm-case';confirm.onclick=()=>{if(c.eligible_documents.some(id=>!['R','N'].includes(state.labels[id]))){alert('请先为所有范围内对象标注相关或不相关；也可先采用作者建议再逐项修正。');return;}state.reviewed=true;render();};
 const details=node('details',undefined,root);node('summary','未来正式指标口径 / 材料指纹',details);node('pre',JSON.stringify(packet.metric_definitions,null,2)+'\n'+packet.packet_sha256,details);
}
document.getElementById('export').onclick=()=>{const reviewer=document.getElementById('reviewer').value.trim();if(!reviewer){alert('请填写审核人；草稿也需要注明来源。');return;}const output={packet_sha256:packet.packet_sha256,reviewer,review_status:Object.values(labels).every(x=>x.reviewed)?'LABELS_READY_FOR_USER_SUBMISSION':'DRAFT',relevance_metrics:null,exported_at:new Date().toISOString(),cases:packet.cases.map(c=>{const s=labels[c.case_id];return {case_id:c.case_id,relevant_documents:c.eligible_documents.filter(id=>s.labels[id]==='R'),nonrelevant_documents:c.eligible_documents.filter(id=>s.labels[id]==='N'),unlabeled_documents:c.eligible_documents.filter(id=>!s.labels[id]),reviewed:s.reviewed,notes:s.notes};})};const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download='human-relevance-annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('import').onchange=async e=>{try{const value=JSON.parse(await e.target.files[0].text());if(value.packet_sha256!==packet.packet_sha256||!Array.isArray(value.cases)||value.cases.length!==packet.cases.length)throw Error('不是当前材料的完整草稿');const next={};for(const c of packet.cases){const source=value.cases.filter(x=>x.case_id===c.case_id);if(source.length!==1)throw Error('组标识缺失或重复');const x=source[0],r=x.relevant_documents,n=x.nonrelevant_documents;if(!Array.isArray(r)||!Array.isArray(n)||typeof x.notes!=='string'||typeof x.reviewed!=='boolean'||new Set([...r,...n]).size!==r.length+n.length||[...r,...n].some(id=>!c.eligible_documents.includes(id)))throw Error('标签集合不合法');const map=Object.fromEntries([...r.map(id=>[id,'R']),...n.map(id=>[id,'N'])]);if(x.reviewed&&c.eligible_documents.some(id=>!map[id]))throw Error('已确认组仍有缺失标签');next[c.case_id]={case_id:c.case_id,labels:map,reviewed:x.reviewed,notes:x.notes};}Object.assign(labels,next);document.getElementById('reviewer').value=typeof value.reviewer==='string'?value.reviewer:'';render();}catch(error){alert('导入失败：'+String(error));}};
render();
</script></html>
