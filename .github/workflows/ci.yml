name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Full quality gate: format, lint, import + docs boundaries, mypy, tsc,
  # contract drift/compatibility, pytest with coverage, TypeScript SDK tests.
  # September 2026: pytest alone took 19 minutes locally. Allow headroom
  # for dependency/browser installation and fresh isolated package builds.
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            web/console/package-lock.json
          node-version: "24"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.29"
      - name: Install locked dependencies
        run: make bootstrap
      - name: Install browser runtime
        working-directory: web/console
        run: npx playwright install --with-deps chromium
      - name: Run quality gates
        run: make ci
